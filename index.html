<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>李梦媛 · 像素小屋简历</title>
<meta name="description" content="李梦媛的互动式像素风简历房间">
<link rel="stylesheet" href="css/base.css?v=17">
<link rel="stylesheet" href="css/room.css?v=17">
<link rel="stylesheet" href="css/panel.css?v=17">
<link rel="stylesheet" href="css/resume-mode.css?v=17">
<link rel="stylesheet" href="css/curio.css?v=17">
</head>
<body>

  <header class="hud">
    <div class="hud-name-plate">
      <span id="hudName" class="hud-name"></span>
      <span id="hudTagline" class="hud-tagline"></span>
    </div>
    <div class="hud-progress-badge">
      <span id="hudProgress" class="hud-progress"></span>
    </div>
  </header>

  <!-- 音效/音乐/简历模式这三个开关原来在这里的按钮，现在分别挪去给桌角好物的
       耳机/手柄/简历（原"闲书"）三个物件了，房间和桌角好物合并成一个板块，
       内嵌小板块而不是页面里上下两块各自带边框的样子 -->
  <main class="room-frame">
    <div class="room-shell">
      <div class="room" id="room" aria-label="可点击的像素小屋，点击道具查看对应经历"></div>
      <div class="curio-shelf" aria-label="桌角好物，点开看小彩蛋/切换音效音乐/进入简历模式">
        <div class="curio-shelf-items" id="curioItems"></div>
      </div>
    </div>
  </main>

  <nav class="item-bar" id="itemBar" aria-label="经历板块快捷入口"></nav>

  <button id="backToRoom" class="pixel-btn resume-back-btn" hidden>🏠 回到房间</button>
  <section id="resumeMode" class="resume-mode" hidden></section>

  <div class="overlay" id="overlay" hidden>
    <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <div class="panel-header">
        <h2 class="panel-title" id="panelTitle"></h2>
        <button class="panel-close pixel-btn" id="panelClose" aria-label="关闭">✕</button>
      </div>
      <div class="panel-tabs" id="panelTabs" role="tablist" hidden></div>
      <div class="panel-body" id="panelBody"></div>
    </div>
  </div>

  <script src="js/content.js?v=17"></script>
  <script src="js/sound.js?v=17"></script>
  <script src="js/bgm.js?v=17"></script>
  <script src="js/pixelate.js?v=17"></script>
  <script src="js/render.js?v=17"></script>
  <script src="js/typewriter.js?v=17"></script>
  <script src="js/contact.js?v=17"></script>
  <script src="js/character.js?v=17"></script>
  <script src="js/panel.js?v=17"></script>
  <script src="js/room.js?v=17"></script>
  <script src="js/greeting.js?v=17"></script>
  <script src="js/curio.js?v=17"></script>
  <script src="js/main.js?v=17"></script>
</body>
</html>
